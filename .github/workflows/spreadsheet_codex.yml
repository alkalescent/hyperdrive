# Manually validate the alternate spreadsheet updater without writing cells.

name: Spreadsheet Codex Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: make ci

      - name: Set up Google credentials
        run: |
          mkdir -p ~/.config/gspread
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT }}' > ~/.config/gspread/service_account.json

      - name: Dry-run alternate spreadsheet updater
        env:
          SPREADSHEET_DRY_RUN: "true"
          SPREADSHEET_SKIP_ROBINHOOD: "true"
          RH_USERNAME: ${{ secrets.RH_USERNAME }}
          RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
          RH_2FA: ${{ secrets.RH_2FA }}
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID: ${{ vars.DUNE_QUERY_ID }}
          VALIDATOR_ID: ${{ vars.VALIDATOR_ID }}
          VALIDATOR_FEE_RECIPIENT: ${{ secrets.VALIDATOR_FEE_RECIPIENT }}
          PRYSM_BEACON_URL: ${{ secrets.PRYSM_BEACON_URL }}
          GETH_RPC_URL: ${{ secrets.GETH_RPC_URL }}
          POLYGON: ${{ secrets.POLYGON }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: uv run python scripts/update_spreadsheet_codex.py
