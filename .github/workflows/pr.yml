name: Pull Request

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

# Secrets go to the steps that use them, as in the scheduled workflows.
env:
  RUN_ID: ${{ github.run_id }}
  TEST: true

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  qr:
    name: QR Codes
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push QR code updates
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        ref: ${{ github.head_ref }}
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    
    - name: Install dependencies
      run: make ci
    
    - name: Generate QR codes
      run: make qr
    
    - name: Commit if changed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add assets/
        if ! git diff --cached --quiet; then
          git commit -m "Update QR codes"
          git push
        fi

  version:
    name: Version Preview
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Needed to comment the version preview
      id-token: write  # Required for OIDC trusted publishing to TestPyPI
    outputs:
      pypi_version: ${{ steps.set-version.outputs.pypi_version }}
    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ github.event.repository.name }}
    
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0  # Need full history for version calculation
    
    - name: Calculate next version (dry run)
      id: version
      uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DRY_RUN: true
        DEFAULT_BUMP: minor
        WITH_V: true
        PRERELEASE: true
        PRERELEASE_SUFFIX: rc
        BRANCH_HISTORY: compare
        INITIAL_VERSION: 1.0.0
    
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    
    - name: Calculate PyPI version
      id: set-version
      run: |
        # Get base version from tag action (e.g., v1.2.0-rc.0)
        BASE_TAG="${NEW_TAG}"
        # Strip 'v' prefix and '-rc.X' suffix to get base version (e.g., 1.2.0)
        BASE_VERSION="${BASE_TAG#v}"
        BASE_VERSION="${BASE_VERSION%-rc.*}"
        # Create unique prerelease version: {base}rc{pr_number}.dev{run_number}
        # e.g., 1.2.0rc42.dev7 for PR #42, run #7
        PYPI_VERSION="${BASE_VERSION}rc${{ github.event.pull_request.number }}.dev${{ github.run_number }}"
        echo "Tag version: $NEW_TAG"
        echo "PyPI version: $PYPI_VERSION"
        echo "pypi_version=$PYPI_VERSION" >> "$GITHUB_OUTPUT"
      env:
        NEW_TAG: ${{ steps.version.outputs.new_tag }}
    
    - name: Build distributions
      run: |
        uv build --sdist
        uv build --wheel
      env:
        # Override hatch-vcs git-derived version to avoid local version identifiers (+gXXX)
        # which TestPyPI rejects
        SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.set-version.outputs.pypi_version }}
    
    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
        # Uses OIDC trusted publishing - configure at:
        # https://test.pypi.org/manage/account/publishing/
    
    - name: Comment version info on PR
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        script: |
          const oldTag = '${{ steps.version.outputs.old_tag }}' || 'none';
          const newTag = '${{ steps.version.outputs.new_tag }}';
          const part = '${{ steps.version.outputs.part }}';
          
          // Extract base version (remove -rc.X suffix for display)
          const baseVersion = newTag.replace(/-rc\.\d+$/, '');
          
          const body = `## 📦 Version Preview
          
          - **Current version:** \`${oldTag}\`
          - **Bump type:** \`${part}\`
          - **Release version:** \`${baseVersion}\`
          - **TestPyPI version:** \`${newTag}\`
          
          When this PR is merged, version will be bumped to \`${baseVersion}\`.
          
          To change the bump type, include in commit message: \`#major\`, \`#minor\`, or \`#patch\``;
          
          // Find existing bot comment with version preview
          const { data: comments } = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          
          const botComment = comments.find(c => 
            c.user.type === 'Bot' && 
            c.body.includes('## 📦 Version Preview')
          );
          
          if (botComment) {
            // Check if version info changed by comparing release version and bump type
            const oldVersionMatch = botComment.body.match(/Release version:\*\* `([^`]+)`/);
            const oldBumpMatch = botComment.body.match(/Bump type:\*\* `([^`]+)`/);
            const oldReleaseVersion = oldVersionMatch ? oldVersionMatch[1] : '';
            const oldBumpType = oldBumpMatch ? oldBumpMatch[1] : '';
            
            if (oldReleaseVersion === baseVersion && oldBumpType === part) {
              console.log('Version info unchanged, skipping comment update');
              return;
            }
            
            // Update existing comment
            await github.rest.issues.updateComment({
              comment_id: botComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
            console.log('Updated existing version comment');
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
            console.log('Created new version comment');
          }

  smoke-testpypi:
    name: Smoke TestPyPI
    needs: version
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false
    
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    
    - name: Install dependencies from PyPI
      run: |
        # Dependencies come from PyPI, pinned by hash in uv.lock, so a project
        # on TestPyPI under a dependency's name is never installed.
        uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
        pip install --require-hashes -r "$RUNNER_TEMP/requirements.txt"
    
    - name: Install from TestPyPI
      run: |
        NAME="${{ github.event.repository.name }}"
        VERSION="${{ needs.version.outputs.pypi_version }}"
        MAX_ATTEMPTS=40
        SLEEP_SECONDS=15

        # Retry the install itself rather than polling an index first. The
        # simple index is CDN-cached per edge, so a separate curl check can
        # see the release while pip's request lands on a stale edge moments
        # later and fails with "No matching distribution found". Retrying the
        # real command makes the check and the action the same client. Only
        # that error is retried; any other install error fails at once.
        for i in $(seq 1 $MAX_ATTEMPTS); do
          if OUTPUT=$(pip install --no-deps --index-url https://test.pypi.org/simple/ \
            "${NAME}==${VERSION}" 2>&1); then
            echo "$OUTPUT"
            echo "Installed ${NAME}==${VERSION} on attempt $i"
            exit 0
          fi
          echo "$OUTPUT"
          if ! grep -qF "No matching distribution found" <<< "$OUTPUT"; then
            echo "Install failed with an error other than a missing release"
            exit 1
          fi
          echo "Attempt $i/$MAX_ATTEMPTS: not installable yet, waiting ${SLEEP_SECONDS}s..."
          sleep $SLEEP_SECONDS
        done
        echo "Timed out after $((MAX_ATTEMPTS * SLEEP_SECONDS)) seconds"
        exit 1
    
    - name: Run smoke tests
      run: python tests/smoke.py

  # =============================================================================
  # Data Pipeline Jobs (parallelized after test matrix)
  # =============================================================================

  # Wave 1: Independent data fetches (run in parallel)
  update-indices:
    name: Update Indices
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - run: make ci
    - name: Update indices
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_BUCKET: ${{ secrets.S3_DEV_BUCKET }}
      run: uv run --frozen --no-dev python scripts/update_indices.py

  # Wave 2: OHLC update (depends on indices)
  update-ohlc:
    name: Update OHLC
    needs: [update-indices]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PRs exercise Alpaca paper data against dev S3; production covers both providers.
    env:
      OHLC_TIMEFRAME: 1m
      OHLC_WORKER_TIMEOUT_SECONDS: 300
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - run: make ci
    - name: Update OHLC
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_BUCKET: ${{ secrets.S3_DEV_BUCKET }}
        POLYGON: ${{ secrets.POLYGON }}
        ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
        ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
      run: uv run --frozen --no-dev python scripts/update_ohlc.py

  # Wave 3: Model creation and portfolio optimization (parallel, depend on OHLC)
  create-model:
    name: Create Model
    needs: update-ohlc
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - run: make ci
    - name: Decrypt scripts
      env:
        RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
        SALT: ${{ secrets.SALT }}
      run: uv run --frozen --no-dev python util/decrypt.py encrypted/create_model.py
    - name: Create model
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_BUCKET: ${{ secrets.S3_DEV_BUCKET }}
      run: uv run --frozen --no-dev python encrypted/create_model.py

  optimize-portfolio:
    name: Optimize Portfolio
    needs: update-ohlc
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - run: make ci
    - name: Decrypt scripts
      env:
        RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
        SALT: ${{ secrets.SALT }}
      run: uv run --frozen --no-dev python util/decrypt.py encrypted/optimize_portfolio.py
    - name: Optimize portfolio
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_BUCKET: ${{ secrets.S3_DEV_BUCKET }}
        ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
        ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
      run: uv run --frozen --no-dev python encrypted/optimize_portfolio.py

  # Wave 4: Visualization and prediction (parallel, depend on model)
  visualize:
    name: Create Visualization
    needs: create-model
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - run: make ci
    - name: Create visualization
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_BUCKET: ${{ secrets.S3_DEV_BUCKET }}
      run: uv run --frozen --no-dev python scripts/visualize.py

  predict-signal:
    name: Predict Signal
    needs: create-model
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - run: make ci
    - name: Decrypt scripts
      env:
        RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
        SALT: ${{ secrets.SALT }}
      run: uv run --frozen --no-dev python util/decrypt.py encrypted/predict_signal.py
    - name: Predict signal
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_BUCKET: ${{ secrets.S3_DEV_BUCKET }}
        POLYGON: ${{ secrets.POLYGON }}
        GLASSNODE: ${{ secrets.GLASSNODE }}
        RH_USERNAME: ${{ secrets.RH_USERNAME }}
        GLASSNODE_PASS: ${{ secrets.GLASSNODE_PASS }}
        EMIT_SECRET: ${{ secrets.DEV_EMIT_SECRET }}
        SALT: ${{ secrets.SALT }}
        RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
      run: uv run --frozen --no-dev python encrypted/predict_signal.py

  # Wave 5: API update and order execution (parallel, depend on signal prediction)
  update-api:
    name: Update API
    needs: predict-signal
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - run: make ci
    - name: Update API
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_BUCKET: ${{ secrets.S3_DEV_BUCKET }}
        SYMBOL: ${{ secrets.SYMBOL }}
        KRAKEN_KEY: ${{ secrets.KRAKEN_KEY }}
        KRAKEN_SECRET: ${{ secrets.KRAKEN_SECRET }}
        PREF_EXCHANGE: ${{ secrets.PREF_EXCHANGE }}
      run: uv run --frozen --no-dev python scripts/update_api.py

  execute-order:
    name: Execute Order
    needs: predict-signal
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - run: make ci
    - name: Execute order
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_BUCKET: ${{ secrets.S3_DEV_BUCKET }}
        BINANCE_TESTNET_KEY: ${{ secrets.BINANCE_TESTNET_KEY }}
        BINANCE_TESTNET_SECRET: ${{ secrets.BINANCE_TESTNET_SECRET }}
        KRAKEN_KEY: ${{ secrets.KRAKEN_KEY }}
        KRAKEN_SECRET: ${{ secrets.KRAKEN_SECRET }}
        PREF_EXCHANGE: ${{ secrets.PREF_EXCHANGE }}
      run: uv run --frozen --no-dev python scripts/execute_order.py
