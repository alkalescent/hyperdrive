name: Pull Request

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

# Secrets go to the steps that use them, as in the scheduled workflows.
env:
  RUN_ID: ${{ github.run_id }}
  TEST: true

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  qr:
    name: QR Codes
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push QR code updates
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.head_ref }}
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    
    - name: Install dependencies
      run: make ci
    
    - name: Generate QR codes
      run: make qr
    
    - name: Commit if changed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add assets/
        if ! git diff --cached --quiet; then
          git commit -m "Update QR codes"
          git push
        fi

  version:
    name: Version Preview
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Needed to comment the version preview
      id-token: write  # Required for OIDC trusted publishing to TestPyPI
    outputs:
      pypi_version: ${{ steps.set-version.outputs.pypi_version }}
    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ github.event.repository.name }}
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Need full history for version calculation
    
    - name: Calculate next version (dry run)
      id: version
      uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DRY_RUN: true
        DEFAULT_BUMP: minor
        WITH_V: true
        PRERELEASE: true
        PRERELEASE_SUFFIX: rc
        BRANCH_HISTORY: compare
        INITIAL_VERSION: 1.0.0
    
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    
    - name: Calculate PyPI version
      id: set-version
      run: |
        # Get base version from tag action (e.g., v1.2.0-rc.0)
        BASE_TAG="${NEW_TAG}"
        # Strip 'v' prefix and '-rc.X' suffix to get base version (e.g., 1.2.0)
        BASE_VERSION="${BASE_TAG#v}"
        BASE_VERSION="${BASE_VERSION%-rc.*}"
        # Create unique prerelease version: {base}rc{pr_number}.dev{run_number}
        # e.g., 1.2.0rc42.dev7 for PR #42, run #7
        PYPI_VERSION="${BASE_VERSION}rc${{ github.event.pull_request.number }}.dev${{ github.run_number }}"
        echo "Tag version: $NEW_TAG"
        echo "PyPI version: $PYPI_VERSION"
        echo "pypi_version=$PYPI_VERSION" >> "$GITHUB_OUTPUT"
      env:
        NEW_TAG: ${{ steps.version.outputs.new_tag }}
    
    - name: Build distributions
      run: |
        uv build --sdist
        uv build --wheel
      env:
        # Override hatch-vcs git-derived version to avoid local version identifiers (+gXXX)
        # which TestPyPI rejects
        SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.set-version.outputs.pypi_version }}
    
    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
        # Uses OIDC trusted publishing - configure at:
        # https://test.pypi.org/manage/account/publishing/
    
    - name: Comment version info on PR
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        script: |
          const oldTag = '${{ steps.version.outputs.old_tag }}' || 'none';
          const newTag = '${{ steps.version.outputs.new_tag }}';
          const part = '${{ steps.version.outputs.part }}';
          
          // Extract base version (remove -rc.X suffix for display)
          const baseVersion = newTag.replace(/-rc\.\d+$/, '');
          
          const body = `## 📦 Version Preview
          
          - **Current version:** \`${oldTag}\`
          - **Bump type:** \`${part}\`
          - **Release version:** \`${baseVersion}\`
          - **TestPyPI version:** \`${newTag}\`
          
          When this PR is merged, version will be bumped to \`${baseVersion}\`.
          
          To change the bump type, include in commit message: \`#major\`, \`#minor\`, or \`#patch\``;
          
          // Find existing bot comment with version preview
          const { data: comments } = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          
          const botComment = comments.find(c => 
            c.user.type === 'Bot' && 
            c.body.includes('## 📦 Version Preview')
          );
          
          if (botComment) {
            // Check if version info changed by comparing release version and bump type
            const oldVersionMatch = botComment.body.match(/Release version:\*\* `([^`]+)`/);
            const oldBumpMatch = botComment.body.match(/Bump type:\*\* `([^`]+)`/);
            const oldReleaseVersion = oldVersionMatch ? oldVersionMatch[1] : '';
            const oldBumpType = oldBumpMatch ? oldBumpMatch[1] : '';
            
            if (oldReleaseVersion === baseVersion && oldBumpType === part) {
              console.log('Version info unchanged, skipping comment update');
              return;
            }
            
            // Update existing comment
            await github.rest.issues.updateComment({
              comment_id: botComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
            console.log('Updated existing version comment');
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
            console.log('Created new version comment');
          }

  smoke-testpypi:
    name: Smoke TestPyPI
    needs: version
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    
    - name: Install dependencies from PyPI
      run: |
        # Dependencies come from PyPI, pinned by hash in uv.lock, so a project
        # on TestPyPI under a dependency's name is never installed.
        uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
        pip install --require-hashes -r "$RUNNER_TEMP/requirements.txt"
    
    - name: Install from TestPyPI
      run: |
        NAME="${{ github.event.repository.name }}"
        VERSION="${{ needs.version.outputs.pypi_version }}"
        MAX_ATTEMPTS=40
        SLEEP_SECONDS=15
        RELEASE_JSON="$RUNNER_TEMP/release.json"
        DIST="$RUNNER_TEMP/testpypi"

        # Read this version's own JSON page instead of the project's simple
        # index. The CDN can serve a simple index from before the upload for
        # over 10 minutes: three alkalescent/silicon pull request runs on
        # 2026-11-25 saw one such page on all 40 attempts. This job is the
        # first to request its version's page, after the upload, so no edge
        # holds an older copy of it. Only a 404 is retried; any other status
        # fails at once.
        for i in $(seq 1 $MAX_ATTEMPTS); do
          STATUS=$(curl -sS -o "$RELEASE_JSON" -w '%{http_code}' \
            "https://test.pypi.org/pypi/${NAME}/${VERSION}/json")
          if [ "$STATUS" = 200 ]; then
            echo "Found ${NAME} ${VERSION} on attempt $i"
            break
          fi
          if [ "$STATUS" != 404 ]; then
            echo "TestPyPI returned HTTP $STATUS for ${NAME} ${VERSION}"
            exit 1
          fi
          if [ "$i" = "$MAX_ATTEMPTS" ]; then
            echo "Timed out after $((MAX_ATTEMPTS * SLEEP_SECONDS)) seconds"
            exit 1
          fi
          echo "Attempt $i/$MAX_ATTEMPTS: not on TestPyPI yet, waiting ${SLEEP_SECONDS}s..."
          sleep $SLEEP_SECONDS
        done

        # The page lists one wheel. Check its SHA-256, then install it from a
        # local directory so pip still matches the name and version.
        WHEEL_INFO=$(jq -er '[.urls[] | select(.packagetype == "bdist_wheel")]
          | if length == 1 then .[0] | "\(.url) \(.digests.sha256)"
            else error("expected one wheel, found \(length)") end' "$RELEASE_JSON")
        read -r URL SHA256 <<< "$WHEEL_INFO"
        case "$URL" in
          https://test-files.pythonhosted.org/packages/*) ;;
          *) echo "Unexpected wheel URL: $URL"; exit 1 ;;
        esac
        mkdir -p "$DIST"
        WHEEL="$DIST/${URL##*/}"
        curl -fsSL --retry 3 -o "$WHEEL" "$URL"
        echo "$SHA256  $WHEEL" | sha256sum -c -
        pip install --no-deps --no-index --find-links "$DIST" "${NAME}==${VERSION}"
    
    - name: Run smoke tests
      run: python tests/smoke.py

  # `pip install hyperdrive` resolves the newest dependencies the pyproject
  # bounds allow, ignoring uv.lock. This job installs the built wheel the same
  # way and runs the smoke and unit tests on it, so a dependency release that
  # breaks hyperdrive fails a pull request before a release reaches PyPI,
  # where Smoke PyPI would first see it.
  smoke-fresh-install:
    name: Smoke Fresh Install
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Full history needed for hatch-vcs
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

    - name: Build wheel
      run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"

    - name: Install wheel with fresh dependencies
      run: |
        pip install "$RUNNER_TEMP"/dist/*.whl
        pip show vectorbt plotly polars pyarrow numpy | grep -E '^(Name|Version):'

    - name: Run smoke tests
      run: python tests/smoke.py

    # After the smoke tests, so those run on a user's install alone. pip keeps
    # the installed versions unless a test tool needs another.
    - name: Install test tools
      run: |
        python -m pip install --upgrade pip  # --group needs pip 25.1 or later
        pip install --group dev
        pip show vectorbt plotly polars pyarrow numpy | grep -E '^(Name|Version):'

    - name: Run unit tests
      # python -m puts the checkout first on sys.path, as uv's editable install
      # does for make cov, so test_Scripts.py can import scripts/, which the
      # wheel leaves out. The code matches the wheel's; the dependencies are
      # the fresh set installed above.
      run: python -m pytest tests/unit

  # The release's build and Check built version steps, run against a local
  # throwaway tag. Nothing is pushed or published.
  release-build:
    name: Release Build
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: 0.0.0
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Full history needed for hatch-vcs
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

    - name: Refuse an untagged build
      run: |
        uv build --sdist --out-dir "$RUNNER_TEMP/untagged"
        uv build --wheel --out-dir "$RUNNER_TEMP/untagged"
        if python scripts/check_dist.py "$VERSION" "$RUNNER_TEMP/untagged"; then
          echo "The check accepted a build of an untagged commit"
          exit 1
        fi

    - name: Tag throwaway version
      run: git tag --force "v$VERSION"

    - name: Build distributions
      run: |
        uv build --sdist
        uv build --wheel

    - name: Check built version
      run: python scripts/check_dist.py "$VERSION"

  # Update API and Execute Order wait on Predict Signal, so their scripts are
  # imported here, under the same --no-dev install, without their entry points.
  script-imports:
    name: Script Imports
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - run: make ci
    - name: Import update_api
      # main() runs only under __main__, so the import builds no clients.
      run: >-
        uv run --frozen --no-dev python -c
        "import runpy; runpy.run_path('scripts/update_api.py', run_name='import_check')"
    - name: Import execute_order's imports
      # execute_order.py has no main(): it builds MarketData and reads
      # signals.csv from S3 at module level. Only its import statements run.
      run: |
        uv run --frozen --no-dev python - scripts/execute_order.py <<'EOF'
        import ast
        import sys
        from pathlib import Path

        path = sys.argv[1]
        tree = ast.parse(Path(path).read_text(), path)
        imports = [
            node for node in tree.body if isinstance(node, (ast.Import, ast.ImportFrom))
        ]
        exec(compile(ast.Module(body=imports, type_ignores=[]), path, "exec"), {})
        print(f"Ran {len(imports)} import statements from {path}")
        EOF

  # =============================================================================
  # Data Pipeline Jobs (parallelized after test matrix)
  # =============================================================================

  # Wave 1: Independent data fetches (run in parallel)
  update-indices:
    name: Update Indices
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - run: make ci
    - name: Update indices
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_BUCKET: ${{ secrets.S3_DEV_BUCKET }}
      run: uv run --frozen --no-dev python scripts/update_indices.py

  # Wave 2: OHLC update (depends on indices)
  update-ohlc:
    name: Update OHLC
    needs: [update-indices]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PRs exercise Alpaca paper data against dev S3; production covers both providers.
    env:
      OHLC_TIMEFRAME: 1m
      OHLC_WORKER_TIMEOUT_SECONDS: 300
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - run: make ci
    - name: Update OHLC
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_BUCKET: ${{ secrets.S3_DEV_BUCKET }}
        POLYGON: ${{ secrets.POLYGON }}
        ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
        ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
      run: uv run --frozen --no-dev python scripts/update_ohlc.py

  # Wave 3: Model creation and portfolio optimization (parallel, depend on OHLC)
  create-model:
    name: Create Model
    needs: update-ohlc
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - run: make ci
    - name: Decrypt scripts
      env:
        RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
        SALT: ${{ secrets.SALT }}
      run: uv run --frozen --no-dev python util/decrypt.py encrypted/create_model.py
    - name: Create model
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_BUCKET: ${{ secrets.S3_DEV_BUCKET }}
        # Ray 2.54+ leaves .git out of the working directory it ships to its
        # workers, and each worker's `uv run` needs .git for the hatch-vcs version.
        RAY_OVERRIDE_RUNTIME_ENV_DEFAULT_EXCLUDES: ""
      run: uv run --frozen --no-dev python encrypted/create_model.py

  optimize-portfolio:
    name: Optimize Portfolio
    needs: update-ohlc
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - run: make ci
    - name: Decrypt scripts
      env:
        RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
        SALT: ${{ secrets.SALT }}
      run: uv run --frozen --no-dev python util/decrypt.py encrypted/optimize_portfolio.py
    - name: Optimize portfolio
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_BUCKET: ${{ secrets.S3_DEV_BUCKET }}
        ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
        ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
      run: uv run --frozen --no-dev python encrypted/optimize_portfolio.py

  # Wave 4: Visualization and prediction (parallel, depend on model)
  visualize:
    name: Create Visualization
    needs: create-model
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - run: make ci
    - name: Create visualization
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_BUCKET: ${{ secrets.S3_DEV_BUCKET }}
      run: uv run --frozen --no-dev python scripts/visualize.py

  predict-signal:
    name: Predict Signal
    needs: create-model
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - run: make ci
    - name: Decrypt scripts
      env:
        RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
        SALT: ${{ secrets.SALT }}
      run: uv run --frozen --no-dev python util/decrypt.py encrypted/predict_signal.py
    - name: Predict signal
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_BUCKET: ${{ secrets.S3_DEV_BUCKET }}
        POLYGON: ${{ secrets.POLYGON }}
        GLASSNODE: ${{ secrets.GLASSNODE }}
        RH_USERNAME: ${{ secrets.RH_USERNAME }}
        GLASSNODE_PASS: ${{ secrets.GLASSNODE_PASS }}
        EMIT_SECRET: ${{ secrets.DEV_EMIT_SECRET }}
        SALT: ${{ secrets.SALT }}
        RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
      run: uv run --frozen --no-dev python encrypted/predict_signal.py

  # Wave 5: API update and order execution (parallel, depend on signal prediction)
  update-api:
    name: Update API
    needs: predict-signal
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - run: make ci
    - name: Update API
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_BUCKET: ${{ secrets.S3_DEV_BUCKET }}
        SYMBOL: ${{ secrets.SYMBOL }}
        KRAKEN_KEY: ${{ secrets.KRAKEN_KEY }}
        KRAKEN_SECRET: ${{ secrets.KRAKEN_SECRET }}
        PREF_EXCHANGE: ${{ secrets.PREF_EXCHANGE }}
      run: uv run --frozen --no-dev python scripts/update_api.py

  execute-order:
    name: Execute Order
    needs: predict-signal
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - run: make ci
    - name: Execute order
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_BUCKET: ${{ secrets.S3_DEV_BUCKET }}
        BINANCE_TESTNET_KEY: ${{ secrets.BINANCE_TESTNET_KEY }}
        BINANCE_TESTNET_SECRET: ${{ secrets.BINANCE_TESTNET_SECRET }}
        KRAKEN_KEY: ${{ secrets.KRAKEN_KEY }}
        KRAKEN_SECRET: ${{ secrets.KRAKEN_SECRET }}
        PREF_EXCHANGE: ${{ secrets.PREF_EXCHANGE }}
      run: uv run --frozen --no-dev python scripts/execute_order.py
