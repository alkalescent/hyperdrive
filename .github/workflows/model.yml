# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Model Creation

on:
  workflow_dispatch:
  schedule:
    # every hour on the 15th of each month
    # - cron: "0 * 15 * *"
    # try every 90 mins of the 15th?
    # so no overlap between runs
    - cron: "*/90 * 15 * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        order: [2]
        window: [14]
        # trial: [1, 2, 3, 4, 5]
      fail-fast: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: make ci

      - name: Decrypt script
        env:
          RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
          SALT: ${{ secrets.SALT }}
        run: uv run --frozen --no-dev python util/decrypt.py encrypted/create_model.py

      - name: Create model
        env:
          # EVENT: ${{ github.event_name }}
          ORDER: ${{ matrix.order }}
          WINDOW: ${{ matrix.window }}
          # TRIAL: ${{ matrix.trial }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: uv run --frozen --no-dev python encrypted/create_model.py

      # Add step to create visualization after automating model creation
      # Should be able to copy step from visualize.yml
