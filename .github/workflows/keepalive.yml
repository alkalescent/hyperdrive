name: Keep Alive

on:
    schedule:
      - cron: "0 0 * * *"
    workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: make ci

      - name: Enable workflows
        env:
          GITHUB: ${{ secrets.GITHUB }}
        run: uv run python util/keepalive.py
