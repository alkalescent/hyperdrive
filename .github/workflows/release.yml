name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  id-token: write  # Required for OIDC trusted publishing to PyPI

env:
  RUN_ID: ${{ github.run_id }}
  RH_USERNAME: ${{ secrets.RH_USERNAME }}
  RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
  RH_2FA: ${{ secrets.RH_2FA }}
  GLASSNODE: ${{ secrets.GLASSNODE }}
  BLS: ${{ secrets.BLS }}
  BINANCE_TESTNET_KEY: ${{ secrets.BINANCE_TESTNET_KEY }}
  BINANCE_TESTNET_SECRET: ${{ secrets.BINANCE_TESTNET_SECRET }}
  KRAKEN_KEY: ${{ secrets.KRAKEN_KEY }}
  KRAKEN_SECRET: ${{ secrets.KRAKEN_SECRET }}
  POLYGON: ${{ secrets.POLYGON }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  PREF_EXCHANGE: ${{ secrets.PREF_EXCHANGE }}
  GLASSNODE_PASS: ${{ secrets.GLASSNODE_PASS }}
  ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
  ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  version:
    name: Version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_tag }}
      tag_name: ${{ steps.version.outputs.new_tag }}
      pypi_version: ${{ steps.set-version.outputs.pypi_version }}
    
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Bump version and push tag
      id: version
      uses: anothrNick/github-tag-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEFAULT_BUMP: minor
        WITH_V: true
        TAG_CONTEXT: repo
        BRANCH_HISTORY: compare
        INITIAL_VERSION: 1.0.0
    
    - name: Update version in pyproject.toml
      id: set-version
      run: |
        # Strip 'v' prefix for PyPI-compatible version
        PYPI_VERSION="${NEW_TAG#v}"
        sed -i "s/^version = .*/version = \"$PYPI_VERSION\"/" pyproject.toml
        echo "Tag version: $NEW_TAG"
        echo "PyPI version: $PYPI_VERSION"
        echo "pypi_version=$PYPI_VERSION" >> $GITHUB_OUTPUT
        grep "^version" pyproject.toml
      env:
        NEW_TAG: ${{ steps.version.outputs.new_tag }}
    # Note: Version is injected locally for this job only.
    # Not committed to repo - downstream jobs inject version from tag.

  publish:
    name: Publish PyPI
    needs: version
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ github.event.repository.name }}
    
    steps:
    - uses: actions/checkout@v5
      with:
        ref: master
        fetch-depth: 1
    
    - name: Pull latest changes
      run: git pull origin master
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    
    - name: Inject version from tag
      run: |
        PYPI_VERSION="${{ needs.version.outputs.new_version }}"
        PYPI_VERSION="${PYPI_VERSION#v}"  # Strip 'v' prefix
        sed -i "s/^version = .*/version = \"$PYPI_VERSION\"/" pyproject.toml
        echo "PyPI version: $PYPI_VERSION"
        grep "^version" pyproject.toml
    
    - name: Build distributions
      run: |
        uv build --sdist
        uv build --wheel
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      # Uses OIDC trusted publishing - configure at:
      # https://pypi.org/manage/account/publishing/

  release:
    name: Release
    needs: [version, publish]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
      with:
        ref: master
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.version.outputs.tag_name }}
        body: |
          ## 📦 Installation
          
          ```bash
          pip install hyperdrive==${{ needs.version.outputs.pypi_version }}
          ```
          
          Or with uv:
          ```bash
          uv pip install hyperdrive==${{ needs.version.outputs.pypi_version }}
          ```
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(needs.version.outputs.new_version, 'alpha') || contains(needs.version.outputs.new_version, 'beta') || contains(needs.version.outputs.new_version, 'rc') }}

  smoke-pypi:
    name: Smoke PyPI
    needs: [version, publish]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Wait for PyPI indexing
      run: |
        NAME="${{ github.event.repository.name }}"
        VERSION="${{ needs.version.outputs.pypi_version }}"
        MAX_ATTEMPTS=40
        SLEEP_SECONDS=15
        
        echo "Waiting for ${NAME}==${VERSION} to be available on PyPI..."
        for i in $(seq 1 $MAX_ATTEMPTS); do
          if curl -sf "https://pypi.org/pypi/${NAME}/${VERSION}/json" > /dev/null 2>&1; then
            echo "Package available after $((i * SLEEP_SECONDS)) seconds"
            exit 0
          fi
          echo "Attempt $i/$MAX_ATTEMPTS: Package not yet available, waiting ${SLEEP_SECONDS}s..."
          sleep $SLEEP_SECONDS
        done
        echo "Timed out waiting for package after $((MAX_ATTEMPTS * SLEEP_SECONDS)) seconds"
        exit 1
    
    - name: Install from PyPI
      run: pip install ${{ github.event.repository.name }}==${{ needs.version.outputs.pypi_version }}
    
    - name: Run smoke tests
      run: python tests/smoke.py
