name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  version:
    name: Version
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push the version tag
    outputs:
      new_version: ${{ steps.version.outputs.new_tag }}
      tag_name: ${{ steps.version.outputs.new_tag }}
      pypi_version: ${{ steps.set-version.outputs.pypi_version }}
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Bump version and push tag
      id: version
      uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEFAULT_BUMP: minor
        WITH_V: true
        TAG_CONTEXT: repo
        BRANCH_HISTORY: compare
        INITIAL_VERSION: 1.0.0
    
    - name: Set version output
      id: set-version
      run: |
        # Strip 'v' prefix for PyPI-compatible version
        PYPI_VERSION="${NEW_TAG#v}"
        echo "Tag version: $NEW_TAG"
        echo "PyPI version: $PYPI_VERSION"
        echo "pypi_version=$PYPI_VERSION" >> "$GITHUB_OUTPUT"
      env:
        NEW_TAG: ${{ steps.version.outputs.new_tag }}
    # Note: hatch-vcs reads version from git tag at build time

  publish:
    name: Publish PyPI
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing to PyPI
    environment:
      name: pypi
      url: https://pypi.org/p/${{ github.event.repository.name }}
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.version.outputs.tag_name }}
        fetch-depth: 0  # Full history needed for hatch-vcs
    
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    
    - name: Build distributions
      run: |
        uv build --sdist
        uv build --wheel
    
    # The Release Build job in pr.yml runs these build and check steps.
    - name: Check built version
      env:
        PYPI_VERSION: ${{ needs.version.outputs.pypi_version }}
      run: python scripts/check_dist.py "$PYPI_VERSION"
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      # Uses OIDC trusted publishing - configure at:
      # https://pypi.org/manage/account/publishing/

  release:
    name: Release
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to create the release
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: master
    
    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: ${{ needs.version.outputs.tag_name }}
        body: |
          ## 📦 Installation
          
          ```bash
          pip install hyperdrive==${{ needs.version.outputs.pypi_version }}
          ```
          
          Or with uv:
          ```bash
          uv pip install hyperdrive==${{ needs.version.outputs.pypi_version }}
          ```
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(needs.version.outputs.new_version, 'alpha') || contains(needs.version.outputs.new_version, 'beta') || contains(needs.version.outputs.new_version, 'rc') }}

  smoke-pypi:
    name: Smoke PyPI
    needs: [version, publish]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'
    
    - name: Install from PyPI
      run: |
        NAME="${{ github.event.repository.name }}"
        VERSION="${{ needs.version.outputs.pypi_version }}"
        MAX_ATTEMPTS=40
        SLEEP_SECONDS=15
        RELEASE_JSON="$RUNNER_TEMP/release.json"
        DIST="$RUNNER_TEMP/pypi"

        # Read this version's own JSON page instead of the project's simple
        # index. The CDN can serve a simple index from before the upload for
        # over 10 minutes: alkalescent/interstellar's v1.5.0 release run on
        # 2026-11-25 saw one such page on all 40 attempts, starting 22 s after
        # the upload. This job is the first to request its version's page,
        # after the upload, so no edge holds an older copy of it. Only a 404
        # is retried; any other status fails at once.
        for i in $(seq 1 $MAX_ATTEMPTS); do
          STATUS=$(curl -sS -o "$RELEASE_JSON" -w '%{http_code}' \
            "https://pypi.org/pypi/${NAME}/${VERSION}/json")
          if [ "$STATUS" = 200 ]; then
            echo "Found ${NAME} ${VERSION} on attempt $i"
            break
          fi
          if [ "$STATUS" != 404 ]; then
            echo "PyPI returned HTTP $STATUS for ${NAME} ${VERSION}"
            exit 1
          fi
          if [ "$i" = "$MAX_ATTEMPTS" ]; then
            echo "Timed out after $((MAX_ATTEMPTS * SLEEP_SECONDS)) seconds"
            exit 1
          fi
          echo "Attempt $i/$MAX_ATTEMPTS: not on PyPI yet, waiting ${SLEEP_SECONDS}s..."
          sleep $SLEEP_SECONDS
        done

        # The page lists one wheel. Check its SHA-256, then install that file,
        # with its dependencies from PyPI's index as a user's install takes them.
        WHEEL_INFO=$(jq -er '[.urls[] | select(.packagetype == "bdist_wheel")]
          | if length == 1 then .[0] | "\(.url) \(.digests.sha256)"
            else error("expected one wheel, found \(length)") end' "$RELEASE_JSON")
        read -r URL SHA256 <<< "$WHEEL_INFO"
        case "$URL" in
          https://files.pythonhosted.org/packages/*) ;;
          *) echo "Unexpected wheel URL: $URL"; exit 1 ;;
        esac
        mkdir -p "$DIST"
        WHEEL="$DIST/${URL##*/}"
        curl -fsSL --retry 3 -o "$WHEEL" "$URL"
        echo "$SHA256  $WHEEL" | sha256sum -c -
        pip install "$WHEEL"
    
    - name: Run smoke tests
      run: python tests/smoke.py
