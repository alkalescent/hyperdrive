name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  version:
    name: Version
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push the version tag
    outputs:
      new_version: ${{ steps.version.outputs.new_tag }}
      tag_name: ${{ steps.version.outputs.new_tag }}
      pypi_version: ${{ steps.set-version.outputs.pypi_version }}
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Bump version and push tag
      id: version
      uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEFAULT_BUMP: minor
        WITH_V: true
        TAG_CONTEXT: repo
        BRANCH_HISTORY: compare
        INITIAL_VERSION: 1.0.0
    
    - name: Set version output
      id: set-version
      run: |
        # Strip 'v' prefix for PyPI-compatible version
        PYPI_VERSION="${NEW_TAG#v}"
        echo "Tag version: $NEW_TAG"
        echo "PyPI version: $PYPI_VERSION"
        echo "pypi_version=$PYPI_VERSION" >> "$GITHUB_OUTPUT"
      env:
        NEW_TAG: ${{ steps.version.outputs.new_tag }}
    # Note: hatch-vcs reads version from git tag at build time

  publish:
    name: Publish PyPI
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing to PyPI
    environment:
      name: pypi
      url: https://pypi.org/p/${{ github.event.repository.name }}
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.version.outputs.tag_name }}
        fetch-depth: 0  # Full history needed for hatch-vcs
    
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    
    - name: Build distributions
      run: |
        uv build --sdist
        uv build --wheel
    
    # The Release Build job in pr.yml runs these build and check steps.
    - name: Check built version
      env:
        PYPI_VERSION: ${{ needs.version.outputs.pypi_version }}
      run: python scripts/check_dist.py "$PYPI_VERSION"
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      # Uses OIDC trusted publishing - configure at:
      # https://pypi.org/manage/account/publishing/

  release:
    name: Release
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to create the release
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: master
    
    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: ${{ needs.version.outputs.tag_name }}
        body: |
          ## 📦 Installation
          
          ```bash
          pip install hyperdrive==${{ needs.version.outputs.pypi_version }}
          ```
          
          Or with uv:
          ```bash
          uv pip install hyperdrive==${{ needs.version.outputs.pypi_version }}
          ```
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(needs.version.outputs.new_version, 'alpha') || contains(needs.version.outputs.new_version, 'beta') || contains(needs.version.outputs.new_version, 'rc') }}

  smoke-pypi:
    name: Smoke PyPI
    needs: [version, publish]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    
    - name: Install from PyPI
      run: |
        NAME="${{ github.event.repository.name }}"
        VERSION="${{ needs.version.outputs.pypi_version }}"
        MAX_ATTEMPTS=40
        SLEEP_SECONDS=15

        # Retry the install itself rather than polling an index first. The
        # simple index is CDN-cached per edge, so a separate curl check can
        # see the release while pip's request lands on a stale edge moments
        # later and fails with "No matching distribution found". Retrying the
        # real command makes the check and the action the same client. Only
        # that error for this release is retried; a dependency pip cannot
        # find, or any other install error, fails at once.
        for i in $(seq 1 $MAX_ATTEMPTS); do
          if OUTPUT=$(pip install "${NAME}==${VERSION}" 2>&1); then
            echo "$OUTPUT"
            echo "Installed ${NAME}==${VERSION} on attempt $i"
            exit 0
          fi
          echo "$OUTPUT"
          if ! grep -qF "No matching distribution found for ${NAME}==${VERSION}" <<< "$OUTPUT"; then
            echo "Install failed with an error other than a missing release"
            exit 1
          fi
          echo "Attempt $i/$MAX_ATTEMPTS: not installable yet, waiting ${SLEEP_SECONDS}s..."
          sleep $SLEEP_SECONDS
        done
        echo "Timed out after $((MAX_ATTEMPTS * SLEEP_SECONDS)) seconds"
        exit 1
    
    - name: Run smoke tests
      run: python tests/smoke.py
