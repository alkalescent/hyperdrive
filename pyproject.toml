[project]
name = "hyperdrive"
dynamic = ["version"]
description = "An algorithmic trading platform"
readme = "README.md"
requires-python = "==3.11.*"
license = "MIT"
authors = [{ name = "Krish Suchak" }]
dependencies = [
    "python-dotenv>=1.1.0",
    "pandas>=2.2.3",
    "robin-stocks>=3.4.0",
    "boto3>=1.38.13",
    "polygon-api-client>=1.11.0",
    "pytz>=2025.2",
    "vectorbt>=0.28.0",
    "scipy>=1.15.3",
    "scikit-learn>=1.6.1",
    "cryptography>=44.0.3",
    "ta>=0.11.0",
    "python-binance>=1.0.28",
    "imbalanced-learn>=0.13.0",
    "icosphere>=0.1.3",
    "numpy>=1.26.4",
    "beautifulsoup4>=4.13.4",
    "lxml>=5.4.0",
    "autogluon>=1.3.0",
    "selenium>=4.27.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ordered-set",
    "ruff",
    "moto",
    "pytest-mock",
    "responses",
    "freezegun",
]

[project.urls]
Homepage = "https://github.com/suchak1/hyperdrive"
"Bug Reports" = "https://github.com/suchak1/hyperdrive/issues"
Source = "https://github.com/suchak1/hyperdrive"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "hyperdrive/_version.py"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]  # Don't require annotations/docstrings in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-n auto -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require real API calls)",
]

[tool.coverage.run]
source = ["hyperdrive"]
omit = ["tests/*", ".venv/*", "build/*", "scripts/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
