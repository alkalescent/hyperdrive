[project]
name = "hyperdrive"
dynamic = ["version"]
description = "An algorithmic trading platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Krish Suchak", email = "suchak.krish@gmail.com" }]
dependencies = [
    "python-dotenv>=1.1.0",
    "pandas>=2.2.3",
    "robin-stocks>=3.4.0",
    "boto3>=1.38.13",
    "polygon-api-client>=1.11.0",
    "pytz>=2025.2",
    "vectorbt>=0.28.0",
    "scipy>=1.15.3",
    "scikit-learn>=1.6.1",
    "cryptography>=44.0.3",
    "ta>=0.11.0",
    "python-binance>=1.0.28",
    "imbalanced-learn>=0.13.0",
    "icosphere>=0.1.3",
    "numpy>=1.26.4",
    "beautifulsoup4>=4.13.4",
    "lxml>=5.4.0",
    "autogluon>=1.3.0",
    "selenium>=4.27.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "moto>=5.0.27",
    "pytest-mock>=3.14.0",
    "responses>=0.25.3",
    "freezegun>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/suchak1/hyperdrive"
"Bug Reports" = "https://github.com/suchak1/hyperdrive/issues"
Source = "https://github.com/suchak1/hyperdrive"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "hyperdrive/_version.py"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require real API calls)",
]
